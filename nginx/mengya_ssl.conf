# 萌芽平台 nginx SSL 反向代理配置
# 外部访问 10224 端口（HTTPS），反代到后端真实服务端口
#
# 使用方式：
#   1. 本地 nginx:  nginx -c /path/to/mengya_ssl.conf
#   2. Docker:      docker run -d -p 10224:10224 -v ./nginx/mengya_ssl.conf:/etc/nginx/conf.d/default.conf -v ./nginx/ssl:/etc/nginx/ssl nginx:alpine
#
# 自定义端口通过环境变量 EXTERNAL_PORT 控制（默认 10224）

server {
    listen 10224 ssl;
    server_name localhost;

    # SSL 证书（自签名或 Let's Encrypt）
    ssl_certificate     /etc/nginx/ssl/mengya.crt;
    ssl_certificate_key /etc/nginx/ssl/mengya.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传文件大小限制
    client_max_body_size 20M;

    # 前端（Vite dev 或构建后的静态文件）
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态文件（如果前端已构建）
    # location /static/ {
    #     alias /app/frontend/dist/;
    #     expires 30d;
    # }
}
