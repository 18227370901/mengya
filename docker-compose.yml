version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: mengya_db
    environment:
      POSTGRES_DB: mengya
      POSTGRES_USER: mengya
      POSTGRES_PASSWORD: mengya123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengya -d mengya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mengya_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mengya_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
      ADMIN_PHONE: ${ADMIN_PHONE:-13800000001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-管理员}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_data --skip-if-exists &&
             python manage.py ensure_admin &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build: ./backend
    container_name: mengya_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    command: celery -A config worker -l info --pool=solo

  frontend:
    build: ./frontend
    container_name: mengya_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    container_name: mengya_nginx
    ports:
      - "${EXTERNAL_PORT:-10224}:10224"
    volumes:
      - ./nginx/mengya_ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata: