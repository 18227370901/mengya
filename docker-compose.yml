version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: mengya_db
    environment:
      POSTGRES_DB: mengya
      POSTGRES_USER: mengya
      POSTGRES_PASSWORD: mengya123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mengya -d mengya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mengya_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mengya_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_data --skip-if-exists &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build: ./backend
    container_name: mengya_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mengya:mengya123@db:5432/mengya
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    command: celery -A config worker -l info --pool=solo

  frontend:
    build: ./frontend
    container_name: mengya_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata: